name: Deploy staging

# Every green merge to main lands on staging automatically.
# Production is a separate, tag-gated workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race the same environment.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  HUSKY: '0'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging
            type=sha,format=long

      - name: Build & push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Migrate & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v5

      # Fail fast with an actionable message instead of a confusing helm error.
      - name: Check Helm chart is populated
        run: |
          if [ ! -s infrastructure/helm/Chart.yaml ]; then
            echo "::error::infrastructure/helm/Chart.yaml is empty."
            echo "The image was built and pushed successfully, but there is no chart to deploy."
            echo "Populate infrastructure/helm/ (Chart.yaml, values.yaml, values-staging.yaml)"
            echo "and configure the KUBE_CONFIG secret for the staging environment."
            exit 1
          fi

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      # Gated step, run before the new pods start. Migrations are expand-only and
      # backward-compatible so old and new instances coexist during the rollout
      # (docs/04_Architecture/05_deployment-architecture.md "Zero-downtime deploys").
      - name: Run database migrations
        run: |
          kubectl run prisma-migrate-${{ github.run_id }} \
            --namespace staging \
            --image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}" \
            --restart=Never \
            --rm -i \
            --env="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --command -- npx prisma migrate deploy

      - name: Deploy
        run: |
          helm upgrade --install zaroorat-backend infrastructure/helm \
            --namespace staging \
            --create-namespace \
            --values infrastructure/helm/values.yaml \
            --values infrastructure/helm/values-staging.yaml \
            --set image.repository="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" \
            --set image.digest="${{ needs.build.outputs.digest }}" \
            --wait \
            --timeout 10m

      - name: Roll back on failure
        if: failure()
        run: helm rollback zaroorat-backend --namespace staging || true
