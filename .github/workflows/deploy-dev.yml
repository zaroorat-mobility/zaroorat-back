name: Deploy DEV (DigitalOcean)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Fixed, not github.repository (= zaroorat-mobility/zaroorat-back): deploy/bin/deploy.sh and
  # every compose file pull ghcr.io/zaroorat-mobility/zaroorat-backend.
  IMAGE_NAME: zaroorat-mobility/zaroorat-backend

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: sha-${{ github.sha }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Production Image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
          # source links the package to this repository, so it inherits the repo's access.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Ops Image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ops
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-ops
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-ops-latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha

  deploy:
    name: Deploy to DigitalOcean DEV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    environment:
      name: dev
    steps:
      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Trigger Remote Deployment
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::DEPLOY_HOST is not set! Please add DEPLOY_HOST (Droplet IP or dev-api.zaroorat.com) in GitHub Settings -> Environments -> dev -> Variables or Secrets."
            exit 1
          fi
          echo "Connecting to deploy@${DEPLOY_HOST}..."
          ssh -i ~/.ssh/id_ed25519 "deploy@${DEPLOY_HOST}" "deploy ${{ github.sha }} ${{ needs.build.outputs.digest }}"

      - name: Smoke Test Deployed Endpoint
        env:
          API_URL: ${{ vars.API_URL || secrets.API_URL || 'https://dev-api.zaroorat.com' }}
        run: |
          sleep 5
          curl -fsS --retry 5 --retry-delay 3 "${API_URL}/health"
