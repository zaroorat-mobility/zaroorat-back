name: Prisma Schema Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      # The schema is a native Prisma multi-file directory (prisma.config.ts
      # sets `schema: 'prisma/schema'`), so every path lives under prisma/schema.
      - 'prisma/schema/**'
      - 'prisma.config.ts'

concurrency:
  group: prisma-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUSKY: '0'
  # Makes prisma.config.ts load the committed .env.test rather than looking for
  # a .env.development that does not exist on a runner. Neither `prisma format`
  # nor `prisma validate` connects to a database.
  APP_ENV: test

jobs:
  check-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Follow .nvmrc rather than pinning a version that drifts from it.
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # There is no merge step. Prisma 7 reads prisma/schema/ directly, so the
      # single-file schema these checks were originally written against — and
      # the `prisma:merge` script that produced it — no longer exist.
      - name: Format Prisma Schema
        run: npm run prisma:format

      - name: Validate Prisma Schema
        run: npm run prisma:validate

      # `prisma format` rewrites in place, so a non-empty diff means someone
      # committed an unformatted schema.
      - name: Check for Uncommitted Schema Changes
        run: git diff --exit-code prisma/schema/

      - name: Fail Instructions
        if: failure()
        run: |
          echo "::error::prisma/schema/ is not formatted. Run 'npm run prisma:format' locally and commit the result."
          exit 1
