name: Prisma Schema Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'prisma/shared/**'
      - 'prisma/modules/**'
      - 'prisma/schema.prisma'

concurrency:
  group: prisma-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  check-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Follow .nvmrc rather than pinning a version that drifts from it.
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Merge Prisma Schema
        run: npm run prisma:merge

      - name: Format Prisma Schema
        run: npm run prisma:format

      - name: Validate Prisma Schema
        run: npm run prisma:validate

      - name: Check for Uncommitted Schema Changes
        run: git diff --exit-code prisma/schema.prisma

      - name: Fail Instructions
        if: failure()
        run: |
          echo "::error::prisma/schema.prisma is out of sync with the modules! Please run 'npm run prisma:merge && npm run prisma:format' locally and commit the result."
          exit 1
