name: CI

# Mirrors the local hooks so `--no-verify` cannot land unchecked code.
# Pipeline order matches docs/14_Operations/03_release-process.md.
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop

# A new push to the same PR cancels the previous run; main is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  quality:
    name: Lint, format & types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # PostGIS variant: prisma/schema.prisma declares
        # `extensions = [postgis, pgcrypto]`, which the stock postgres image
        # cannot satisfy. Credentials must match .env.test.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: zaroorat
          POSTGRES_PASSWORD: zaroorat
          POSTGRES_DB: zaroorat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zaroorat -d zaroorat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The service container does not run docker/postgres/init/, so the
      # extensions the schema depends on have to be created explicitly here.
      - name: Create database extensions
        run: |
          PGPASSWORD=zaroorat psql -h localhost -U zaroorat -d zaroorat_test \
            -c 'CREATE EXTENSION IF NOT EXISTS postgis;' \
            -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto;'

      # .env.test is committed (dummy values only) and already points at
      # localhost:5432 / localhost:6379, which is where the service containers
      # above are published. No environment setup step is needed.

      # The integration harness TRUNCATEs named tables in beforeEach, so the
      # schema has to exist before a single test runs.
      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          APP_ENV: test

      # prisma/seed/index.ts branches on APP_ENV=test and seeds the roles.
      # Without it every login path fails with
      # `Default role "customer" is not seeded` — 441 of 1283 tests.
      - name: Seed the test database
        run: npx prisma db seed
        env:
          APP_ENV: test

      - name: Run tests
        run: npm test
        env:
          APP_ENV: test

  build:
    name: Build & container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]
    # For the OTP release check: an isolated Redis the built image's job browser runs against.
    services:
      redis:
        image: redis:8
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # tsc emits happily while leaving "@config" imports unresolved, so a green
      # build is not proof the artifact runs. Load the entrypoint's module graph
      # to catch alias-resolution regressions that only bite in production.
      - name: Verify build artifact resolves
        run: |
          test -f dist/server.js || { echo "dist/server.js missing"; exit 1; }
          if grep -rqE "require\(\"@(config|shared|core|modules)" dist; then
            echo "Unresolved tsconfig path aliases in dist — tsc-alias did not run."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only — publishing happens in the staging/production workflows.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: zaroorat-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boots the image under production config validation with no real database.
      # The whole static module graph and every import-time config guard load
      # before bootstrapDatabase() runs, so stopping at a refused database
      # connection proves the image resolves its modules and accepts its
      # configuration. It does NOT prove the API serves traffic: that needs real
      # PostgreSQL/Redis services, and storage/SMS/push are only checked after them.
      #
      # Every key below is a CI-only dummy for this throwaway container — not a
      # secret, never used anywhere else. DB_BOOT_RETRIES=1 makes the expected
      # database failure arrive in seconds instead of after the ~30s retry budget.
      - name: Smoke-test the image
        run: |
          docker run -d --name api -p 3000:3000 \
            -e APP_ENV=production \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/placeholder \
            -e REDIS_URL=redis://localhost:6379 \
            -e JWT_ACCESS_SECRET=ci_access_secret_padded_to_min_32_chars \
            -e JWT_REFRESH_SECRET=ci_refresh_secret_padded_to_min_32_chars \
            -e ENCRYPTION_KEY=ci_encryption_key_padded_to_min_32_chars \
            -e BANK_DATA_ENCRYPTION_KEY=ci_bank_data_key_padded_to_min_32_chars \
            -e BANK_ACCOUNT_HASH_KEY=ci_bank_hash_key_padded_to_min_32_chars \
            -e RIDE_PIN_PEPPER=ci_ride_pin_pepper_padded_to_min_32_chars \
            -e PAYMENT_WEBHOOK_SECRET=ci_payment_webhook_secret_not_real \
            -e DB_BOOT_RETRIES=1 \
            zaroorat-backend:ci
          if ! status=$(timeout 60 docker wait api); then
            docker logs api
            echo "::error::Container still running after 60s; expected it to stop at the placeholder database."
            exit 1
          fi
          log="$RUNNER_TEMP/api.log"
          docker logs api > "$log" 2>&1
          cat "$log"
          echo "Container exit status: $status"
          if grep -q "Cannot find module" "$log"; then
            echo "::error::Image cannot resolve its own modules."
            exit 1
          fi
          if grep -q "Environment validation failed" "$log"; then
            echo "::error::Image rejected its configuration."
            exit 1
          fi
          # Any other crash before the database (an import-time config guard, a bad
          # CMD) prints neither string above, so success is asserted positively —
          # on our own startup catch and bootstrapDatabase() stack frame, because
          # the driver's error text differs by network (ECONNREFUSED vs P2010).
          if ! grep -q "Failed to start application orchestration" "$log" || ! grep -q "at async bootstrapDatabase" "$log"; then
            echo "::error::Image exited (status $status) before reaching the database bootstrap."
            exit 1
          fi
          echo "Image loaded its modules and configuration and stopped at the placeholder database. API readiness is NOT verified by this step."

      # The image compiles its own dist/ from source (.dockerignore excludes any host
      # build), so this checks the code that ships: real auth-otp jobs in every state,
      # listed, fetched, retried and removed through the compiled job browser, must
      # never show the OTP or the phone number.
      - name: Release check — job browser never exposes auth-otp payloads
        run: |
          docker run --rm --network host \
            -v "$PWD/scripts/release:/release:ro" \
            -e RELEASE_CHECK_REDIS_URL=redis://127.0.0.1:6379/9 \
            zaroorat-backend:ci node /release/verify-otp-job-browser.js
