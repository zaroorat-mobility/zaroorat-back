name: Deploy production

# Production ships from a published GitHub Release only — never straight from a
# branch push. Pair this with a protected `production` environment requiring
# manual approval (Settings > Environments).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to deploy (e.g. v1.2.3)'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  HUSKY: '0'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Re-verify release commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # CI already ran on main, but a tag can point anywhere. Prove the exact
      # commit being shipped is green rather than trusting a branch result.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  build:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify]
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    # For the OTP release check below: an isolated Redis, never production's.
    services:
      redis:
        image: redis:8
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.event.release.tag_name }}
            type=raw,value=production
            type=sha,format=long

      # Verify the image before it can be pushed: built from this commit's source (the
      # Dockerfile compiles dist/ itself; .dockerignore keeps any host build out), then the
      # compiled job browser is driven with real auth-otp jobs and must not expose a code
      # or phone. The push below reuses this build's layers.
      - name: Build for release check
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: zaroorat-backend:release-check
          cache-from: type=gha

      - name: Release check — job browser never exposes auth-otp payloads
        run: |
          docker run --rm --network host \
            -v "$PWD/scripts/release:/release:ro" \
            -e RELEASE_CHECK_REDIS_URL=redis://127.0.0.1:6379/9 \
            zaroorat-backend:release-check node /release/verify-otp-job-browser.js

      - name: Build & push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy:
    name: Migrate & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Check Helm chart is populated
        run: |
          if [ ! -s infrastructure/helm/Chart.yaml ]; then
            echo "::error::infrastructure/helm/Chart.yaml is empty."
            echo "The image was built and pushed, but there is no chart to deploy."
            echo "Populate infrastructure/helm/ and set the KUBE_CONFIG secret"
            echo "for the production environment before enabling this workflow."
            exit 1
          fi

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      # The schema owner, for migrations only — never the app's DATABASE_URL, which the Helm
      # secret fills with the restricted runtime login. Two names, so one value cannot serve
      # both (docs/15_Security/database-roles.md).
      - name: Run database migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "::error::secrets.MIGRATION_DATABASE_URL (schema owner) is not set."
            exit 1
          fi
          kubectl run prisma-migrate-${{ github.run_id }} \
            --namespace production \
            --image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}" \
            --restart=Never \
            --rm -i \
            --env="MIGRATION_DATABASE_URL=$MIGRATION_DATABASE_URL" \
            --command -- npx prisma migrate deploy

      # Rolling update; readiness gates each pod (docs/04_Architecture/05_deployment-architecture.md "Zero-downtime deploys").
      - name: Deploy
        run: |
          helm upgrade --install zaroorat-backend infrastructure/helm \
            --namespace production \
            --create-namespace \
            --values infrastructure/helm/values.yaml \
            --values infrastructure/helm/values-production.yaml \
            --set image.repository="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" \
            --set image.digest="${{ needs.build.outputs.digest }}" \
            --atomic \
            --wait \
            --timeout 15m

      # --atomic already reverts a failed release; this covers a deploy that
      # succeeded but failed the post-deploy smoke check below.
      - name: Smoke-check the core loop
        run: |
          for _ in $(seq 1 10); do
            if curl -fsS "${{ vars.PRODUCTION_URL }}/health" > /dev/null; then
              echo "Health check passed."
              exit 0
            fi
            sleep 6
          done
          echo "::error::Health check never passed after deploy."
          exit 1

      - name: Roll back on failure
        if: failure()
        run: helm rollback zaroorat-backend --namespace production || true
