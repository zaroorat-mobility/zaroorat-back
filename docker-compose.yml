# Local development stack: API + Worker + Postgres + Redis.
# API and worker run the same image with different entrypoints — the worker owns
# every queue, including OTP SMS delivery, so an API-only stack sends no SMS.
#
#   make up      start everything
#   make logs    tail the api
#   make down    stop and remove volumes

name: zaroorat-backend

x-app-env: &app-env
  APP_NAME: zaroorat-backend
  APP_ENV: development
  NODE_ENV: development
  DATABASE_URL: postgresql://zaroorat:zaroorat@postgres:5432/zaroorat_dev
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: local_dev_access_secret_do_not_use_in_prod
  JWT_REFRESH_SECRET: local_dev_refresh_secret_do_not_use_in_prod
  JWT_ACCESS_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 30d

services:
  api:
    build:
      context: .
      target: runner
    # Override the production default so local runs get readable logs.
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: runner
    command: ['node', 'dist/worker.js']
    environment:
      <<: *app-env
      WORKER_HEALTH_PORT: 3001
    # Not published: the health server exists for orchestrator probes, not for
    # callers. Reach it from inside the network if you need it.
    expose:
      - '3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: zaroorat
      POSTGRES_PASSWORD: zaroorat
      POSTGRES_DB: zaroorat
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Anything dropped in docker/postgres/init/ runs once on first boot.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -U/-d must be set or pg_isready checks the wrong role and passes early.
      test: ['CMD-SHELL', 'pg_isready -U zaroorat -d zaroorat_dev']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-trixie
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
