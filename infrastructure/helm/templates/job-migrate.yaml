{{- if .Values.migration.enabled }}
# Prisma migrations as a Helm pre-install/pre-upgrade hook: they run once, before
# any API or worker pod is replaced, and a failure stops the release (with --atomic
# the release is reverted). Replaces the old `kubectl run --env=MIGRATION_DATABASE_URL=...`
# step, which put the schema-owner connection string in plain text in the pod spec.
#
# The URL comes from a Secret (migration.existingSecret, key MIGRATION_DATABASE_URL),
# created by the platform secret store or synced by the deploy workflow. The app's
# runtime DATABASE_URL is deliberately NOT given to this Job (docs/15_Security/database-roles.md).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "zaroorat-backend.fullname" . }}-migrate
  labels:
    {{- include "zaroorat-backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    # Keep a failed Job (and its logs) for diagnosis; replace it on the next run.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # Never retry a migration automatically: a half-applied migration needs a human.
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "zaroorat-backend.name" . }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      # Hooks run before the chart's own ServiceAccount exists on first install,
      # so this uses the namespace default account with no API token mounted.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "zaroorat-backend.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The Prisma CLI ships in the runtime image (Dockerfile prod-deps stage
          # rebuilds @prisma/engines so this needs no network egress for binaries).
          command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
          securityContext:
            allowPrivilegeEscalation: false
            # Writable root FS on purpose: the Prisma CLI may write cache files while
            # loading prisma.config.ts. The Job is short-lived and runs no app code.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: APP_ENV
              value: {{ .Values.env.APP_ENV | quote }}
            - name: NODE_ENV
              value: {{ .Values.env.NODE_ENV | quote }}
            - name: HOME
              value: /tmp
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migration.existingSecret }}
                  key: MIGRATION_DATABASE_URL
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpDirSizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
