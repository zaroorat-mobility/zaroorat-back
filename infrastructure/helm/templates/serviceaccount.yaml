{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zaroorat-backend.serviceAccountName" . }}
  labels:
    {{- include "zaroorat-backend.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The API never calls the Kubernetes API, so it has no use for a mounted token.
automountServiceAccountToken: false
{{- end }}
