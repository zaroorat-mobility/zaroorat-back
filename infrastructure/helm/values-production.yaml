# Production overlay. Applied after values.yaml by .github/workflows/production.yml.

replicaCount: 3

env:
  APP_NAME: zaroorat-backend
  APP_ENV: production
  NODE_ENV: production
  HOST: 0.0.0.0
  LOG_LEVEL: info

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    # Still no CPU limit — throttling a ride-hailing API shows up directly as
    # p99 latency. Memory is capped because a leak must not take the node down.
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  # Tolerate losing at most one replica at a time during node drains.
  minAvailable: 2

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Socket.io connections are long-lived; the default 60s
    # proxy read timeout would sever them mid-ride.
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
  hosts:
    - host: api.zaroorat.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: zaroorat-backend-tls-production
      hosts:
        - api.zaroorat.com

# Give in-flight trips longer to drain before SIGKILL.
terminationGracePeriodSeconds: 60
preStopSleepSeconds: 10

existingSecret: zaroorat-backend-secrets
